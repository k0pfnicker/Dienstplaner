name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build .NET 8 WPF App
    runs-on: windows-latest
    
    # Needs permissions to upload files to a release
    permissions:
      contents: write
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Publish Windows 64-bit EXE
      run: dotnet publish ./src/Dienstplanner/Dienstplanner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release_output
      
    - name: Upload Release Asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" release_output/Dienstplanner.exe --clobber
